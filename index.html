<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonitorBot 监控展示与后台管理系统</title>
    <meta name="description" content="基于 TRpAI/monitor-bot 的实时节点与服务监控展示页与后台管理系统，集成 Telegram Bot 数据同步与告警，支持 Cloudflare、Docker 及原生部署。" />
    <meta property="og:title" content="MonitorBot 监控展示与后台管理系统" />
    <meta property="og:description" content="基于 TRpAI/monitor-bot 的实时节点与服务监控展示页与后台管理系统，集成 Telegram Bot 数据同步与告警，支持 Cloudflare、Docker 及原生部署。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('monitor_bot_theme') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-600 dark:selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
